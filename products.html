<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>


  <section class="hero">
    <h2>Everyday tech, honest prices.</h2>
  
    

   <section class="product-grid" id="featured-products"></section>

   <input type="text" id="search-box" placeholder="search product...">

   <button class="category-btn" data-category="ALL">ALL</button>

   <button class="category-btn" data-category="Computers">Computers</button>

   <button class="category-btn" data-category="Accessories">Accessories</button>

   <button class="category-btn" data-category="Samsung Camera">Samsung Camera</button>
   
  <footer class="site-footer"><p>&copy; 2025 ShopNow.</p></footer>
  <selection class="sort-select"></selection>
  <select id="sort-select">
<option value="default">
  Sort by Price
</option>
<option value="low-high">
  Price: Low to High
</option>
<option value="high-low">
  Price: High to Low
</option>

  </select>

 
<div id="product-list" class="product-grid"></div>
  <script src="js/app.js"></script>
</body>
</html>
